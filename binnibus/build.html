<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="robots" content="noindex"><title>Buscador de rutas BinniBus en OpenStreetMap</title>
<style>body{font:13px monospace;margin:10px}#log{white-space:pre-wrap;color:#666;max-height:200px;overflow:auto}#out{white-space:pre-wrap}</style></head>
<body><b>Rutas BinniBus en OpenStreetMap (uso interno)</b><div id="log"></div><div id="out"></div>
<script>
const API="https://api.openstreetmap.org/api/0.6/";
const log=t=>{const l=document.getElementById("log");l.textContent+=t+"\n";l.scrollTop=1e9};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function get(p){for(let i=0;i<3;i++){try{const r=await fetch(API+p);if(r.ok)return await r.json()}catch(e){}await sleep(1500)}return {elements:[]}}
const routes={},masters={},seenNodes=new Set(),queue=[];
function addRel(e){
  if(e.type!=="relation"||!e.tags)return;
  const t=e.tags;
  if(t.type==="route_master"){if(!masters[e.id]&&((t.network||"")+(t.name||"")).match(/binni|citybus/i)){masters[e.id]=1;e.members.forEach(m=>{if(m.type==="relation")queue.push({rel:m.ref})})}return}
  if(t.type!=="route"||!((t.network||"")+" "+(t.name||"")+" "+(t.operator||"")).match(/binni|citybus/i))return;
  if(routes[e.id])return;
  routes[e.id]={ref:t.ref,name:t.name};
  const plats=e.members.filter(m=>m.type==="node"&&/platform|stop/.test(m.role)).map(m=>m.ref);
  plats.forEach((n,i)=>{if(i%3===0&&!seenNodes.has(n)){seenNodes.add(n);queue.push({node:n})}});
  queue.push({master:e.id});
  log(`ruta ${e.id} ${t.ref} ${t.name} (${plats.length} paradas)`);
}
(async()=>{
  const seeds=[19736821,19851160,20781030,21031480];
  const s=await get("relations.json?relations="+seeds.join(","));s.elements.forEach(addRel);
  let n=0;
  while(queue.length){
    const q=queue.shift();n++;
    if(q.node){const j=await get(`node/${q.node}/relations.json`);j.elements.forEach(addRel)}
    else if(q.master){const j=await get(`relation/${q.master}/relations.json`);j.elements.forEach(addRel)}
    else if(q.rel){if(!routes[q.rel]){const j=await get(`relation/${q.rel}.json`);j.elements.forEach(addRel)}}
    if(n%20===0)log(`… ${n} consultas, ${Object.keys(routes).length} rutas, cola ${queue.length}`);
  }
  const ids=Object.keys(routes).sort((a,b)=>(routes[a].ref||"").localeCompare(routes[b].ref||""));
  document.getElementById("out").textContent="BEGIN\n"+ids.map(i=>`${i}|${routes[i].ref}|${routes[i].name}`).join("\n")+"\nEND";
  log("LISTO "+ids.length+" rutas");
})();
</script></body></html>
