# Compila la app de Android "Binni Rutas" (.aab) para Google Play.
# Corre sola cuando cambia binni-app/ o este archivo, o a mano en
# GitHub > Actions > "App Android" > Run workflow.
# El .aab sale SIN firmar y se guarda en la rama "android-build".
# Se firma aparte con la llave de subida (no se guarda en este repositorio).
name: App Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "binni-app/**"
      - "binnibus/**"
      - ".github/workflows/android-playstore.yml"

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: binni-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias
        run: npm ci

      - name: Copiar la página y preparar el proyecto
        run: npm run build:android

      - name: Compilar el .aab
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Guardar el .aab en la rama android-build
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          mkdir -p "$RUNNER_TEMP/out"
          cp "$AAB" "$RUNNER_TEMP/out/binni-rutas-sin-firmar.aab"
          echo "versionCode $VERSION_CODE · commit $GITHUB_SHA" > "$RUNNER_TEMP/out/VERSION.txt"
          cd "$RUNNER_TEMP/out"
          git init -q -b android-build
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add . && git commit -qm "Build Android $VERSION_CODE"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" android-build
