<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>gaabomx</title>
<meta name="theme-color" content="#000000">
<style>
  :root{
    /* Color del álbum: cambia solo esta línea para ajustar el tono */
    --album:#ff5a3c;
    --album-soft:#ff9cf6;
    --ink:#fff7f2;
    --cord:13vh;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{background:#000;color:var(--ink);overflow:hidden;font-family:Georgia,"Times New Roman",serif}

  /* Luz del foco: solo ilumina alrededor, lo demás queda oscuro */
  .glow{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity 1.8s ease}
  .glow i{position:absolute;inset:0;opacity:0;animation:luz 9s ease-in-out infinite}
  .glow i:nth-child(1){background:radial-gradient(ellipse 80% 65% at 50% calc(var(--cord) + 40px), #2b3cff 0%, rgba(0,0,0,0) 72%)}
  .glow i:nth-child(2){background:radial-gradient(ellipse 80% 65% at 50% calc(var(--cord) + 40px), #ff3df2 0%, rgba(0,0,0,0) 72%);animation-delay:-6s}
  .glow i:nth-child(3){background:radial-gradient(ellipse 80% 65% at 50% calc(var(--cord) + 40px), #2bff9a 0%, rgba(0,0,0,0) 72%);animation-delay:-3s}
  @keyframes luz{0%,100%{opacity:0}15%,35%{opacity:1}50%{opacity:0}}
  body.lit .glow{opacity:.55;animation:breathe 5s ease-in-out 2.5s infinite}
  @keyframes breathe{50%{opacity:.4}}

  /* Entrada misteriosa */
  .intro{
    position:fixed;inset:0;z-index:5;background:#000;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;
    text-align:center;padding:24px;transition:opacity 1.4s ease, visibility 1.4s;
  }
  .intro.gone{opacity:0;visibility:hidden}
  .whisper{font-style:italic;font-size:clamp(18px,5vw,26px);letter-spacing:.04em;opacity:0;animation:fadeIn 2.2s ease .6s forwards}
  .whisper span{display:block;font-size:.72em;opacity:.55;margin-top:10px;letter-spacing:.18em;text-transform:uppercase;font-style:normal;font-family:system-ui,sans-serif}
  .key{
    width:96px;height:96px;border-radius:50%;border:1px solid rgba(255,255,255,.35);
    background:transparent;color:var(--ink);cursor:pointer;position:relative;
    font-family:system-ui,sans-serif;font-size:11px;letter-spacing:.22em;text-transform:uppercase;
    opacity:0;animation:fadeIn 1.6s ease 2.4s forwards;
  }
  .key::before,.key::after{content:"";position:absolute;inset:-1px;border-radius:50%;border:1px solid rgba(255,255,255,.5);animation:ring 2.8s ease-out infinite}
  .key::after{animation-delay:1.4s}
  @keyframes ring{from{transform:scale(1);opacity:.7}to{transform:scale(2.1);opacity:0}}
  @keyframes fadeIn{to{opacity:1}}

  /* Escena */
  .stage{position:relative;z-index:2;height:100%;max-width:460px;margin:0 auto;padding:0 22px 28px;text-align:center;overflow-y:auto;overflow-x:hidden}

  /* Foco colgando con el mono de palitos */
  .drop{transform:translateY(-110%);transition:transform 1.5s cubic-bezier(.3,1.35,.5,1)}
  body.hello .drop{transform:none}
  .lamp{width:200px;margin:0 auto;transform-origin:50% 0;animation:swing 3.6s ease-in-out infinite alternate;position:relative}
  @keyframes swing{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
  .cord{width:2px;height:var(--cord);background:rgba(255,247,242,.55);margin:0 auto}
  .lamp svg{width:100%;display:block;overflow:visible;margin-top:-1px}
  .stick{stroke:var(--ink);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;fill:none}
  .glass{fill:#1c1c1c;stroke:rgba(255,247,242,.6);stroke-width:2;transition:fill .2s}
  body.lit .glass{fill:#c9cfff;stroke:#c9cfff;filter:drop-shadow(0 0 14px #2b3cff) drop-shadow(0 0 40px #2b3cff);animation:flick 1.1s steps(1) 1, foco 9s ease-in-out 1.1s infinite}
  @keyframes foco{
    0%,100%{fill:#c9cfff;stroke:#c9cfff;filter:drop-shadow(0 0 14px #2b3cff) drop-shadow(0 0 40px #2b3cff)}
    33%{fill:#ffc9fb;stroke:#ffc9fb;filter:drop-shadow(0 0 14px #ff3df2) drop-shadow(0 0 40px #ff3df2)}
    66%{fill:#c9ffe6;stroke:#c9ffe6;filter:drop-shadow(0 0 14px #2bff9a) drop-shadow(0 0 40px #2bff9a)}
  }
  @keyframes flick{0%{opacity:.2}12%{opacity:1}22%{opacity:.25}34%{opacity:1}46%{opacity:.5}58%,100%{opacity:1}}
  .wave{transform-origin:133px 122px;animation:wave .65s ease-in-out infinite alternate}
  @keyframes wave{from{transform:rotate(-14deg)}to{transform:rotate(22deg)}}
  .leg-a{transform-origin:128px 172px;animation:kick 1.8s ease-in-out infinite alternate}
  .leg-b{transform-origin:128px 172px;animation:kick 1.8s ease-in-out infinite alternate-reverse}
  @keyframes kick{from{transform:rotate(-9deg)}to{transform:rotate(9deg)}}

  /* Sí: salta, da una vuelta y se va corriendo */
  .guy{transform-box:fill-box;transform-origin:50% 50%}
  body.flip .guy{animation:flip 2.8s cubic-bezier(.45,0,.55,1) forwards}
  @keyframes flip{
    0%{transform:none}
    25%{transform:translate(0,-50px) rotate(-180deg)}
    48%{transform:translate(12px,70px) rotate(-360deg)}
    58%{transform:translate(12px,62px) rotate(-360deg)}
    100%{transform:translate(560px,62px) rotate(-360deg)}
  }
  body.flip .leg-a,body.flip .leg-b{animation-duration:.18s}
  body.flip .wave{animation:none;transform:rotate(-60deg)}
  /* No: se apaga el foco y el mono se cae */
  body.fall .guy{animation:drop 1.3s cubic-bezier(.55,0,1,.45) .5s forwards}
  @keyframes drop{to{transform:translate(-8px,280px) rotate(35deg);opacity:0}}
  body.lit.off .glass{fill:#1c1c1c;stroke:rgba(255,247,242,.6);filter:none;animation:none}
  body.lit.off .glow{opacity:.06;animation:none}

  .bubble{
    position:absolute;right:58%;top:calc(var(--cord) + 74px);width:max-content;max-width:158px;text-align:left;
    background:var(--ink);color:#1a0d08;border-radius:16px;padding:8px 13px;
    font-family:system-ui,sans-serif;font-weight:600;font-size:14px;line-height:1.2;
    transform:scale(0);transform-origin:100% 50%;transition:transform .45s cubic-bezier(.2,1.6,.4,1);
  }
  .bubble::after{content:"";position:absolute;right:-5px;top:50%;width:12px;height:12px;background:inherit;transform:translateY(-50%) rotate(45deg)}
  .bubble.on{transform:scale(1)}

  .ask{margin-top:18px;opacity:0;transform:translateY(18px);transition:opacity 1.2s ease, transform 1.2s ease}
  body.asked .ask{opacity:1;transform:none}
  h1{font-weight:400;font-size:clamp(28px,8.4vw,42px);line-height:1.12;text-wrap:balance}
  h1 em{font-style:italic;color:var(--album-soft)}
  .btns{margin-top:24px;display:flex;gap:14px;justify-content:center}
  .btn{font-family:system-ui,sans-serif;font-weight:700;font-size:16px;border:0;cursor:pointer;padding:15px 30px;border-radius:999px;transition:transform .2s ease}
  .btn:active{transform:scale(.95)}
  .yes{background:var(--ink);color:#1a0d08}
  .no{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px rgba(255,247,242,.4)}

  .done{display:none;margin-top:22px;font-size:clamp(19px,5.6vw,25px);font-style:italic;line-height:1.38;text-wrap:pretty}
  .nope{display:none;width:min(200px,54vw);margin:18px auto 0;border-radius:14px;box-shadow:0 10px 40px rgba(0,0,0,.6);transform:rotate(-3deg) scale(.6);opacity:0}
  .nope.on{display:block;animation:pop .6s cubic-bezier(.2,1.5,.4,1) forwards}
  @keyframes pop{to{transform:rotate(-3deg) scale(1);opacity:1}}
  .tiny{font-size:11px;letter-spacing:.08em;opacity:.55;font-style:italic;margin-bottom:10px}
  .btns{flex-wrap:wrap}
  .second{display:none;margin-top:26px}
  .second.on{display:block;animation:fadeIn 1.2s ease forwards;opacity:0}
  h2{font-weight:400;font-size:clamp(24px,7vw,34px);line-height:1.15;text-wrap:balance}
  h2 em{font-style:italic;color:var(--album-soft)}
  .btns2{margin-top:18px;display:flex;gap:14px;justify-content:center}
  .done2{display:none;margin-top:18px;font-size:clamp(19px,5.6vw,25px);font-style:italic}
  .second.answered .btns2{display:none}
  .second.answered .done2{display:block}
  body.answered .btns{display:none}
  body.answered .done{display:block;animation:fadeIn 1s ease forwards}

  .snd{
    position:fixed;z-index:4;right:14px;top:calc(14px + env(safe-area-inset-top));
    background:rgba(255,255,255,.08);color:var(--ink);border:0;border-radius:999px;padding:8px 16px;cursor:pointer;
    font-family:system-ui,sans-serif;font-size:11px;letter-spacing:.18em;text-transform:uppercase;
    opacity:0;pointer-events:none;transition:opacity 1.5s ease;
  }
  body.hello .snd{opacity:.7;pointer-events:auto}

  .confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:6;pointer-events:none;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

  @media (max-height:620px){:root{--cord:6vh}}
  @media (prefers-reduced-motion:reduce){
    .lamp,.wave,.leg-a,.leg-b,.key::before,.key::after,body.lit .glow{animation:none}
  }
</style>
</head>
<body>

<div class="glow"><i></i><i></i><i></i></div>

<div class="intro" id="intro">
  <p class="whisper">alguien dejó algo aquí para ti…<span>sube el volumen</span></p>
  <button class="key" id="enter" aria-label="Entrar">entrar</button>
</div>

<main class="stage">
  <div class="drop">
    <div class="lamp">
      <div class="cord"></div>
      <div class="bubble" id="bubble">Bueno, como me vas a ignorar…</div>
      <svg viewBox="0 0 200 222" aria-hidden="true">
        <!-- foco -->
        <rect x="92" y="0" width="16" height="16" rx="3" fill="#8a8580"/>
        <path class="glass" d="M92 16 h16 c0 8 10 12 10 24 a18 18 0 0 1 -36 0 c0 -12 10 -16 10 -24z"/>
        <!-- mono de palitos colgado del foco con una mano -->
        <g class="guy">
        <path class="stick" d="M133 122 L112 9"/>
        <circle class="stick" cx="137" cy="96" r="15" style="fill:#000"/>
        <path class="stick" d="M134 111 L128 172"/>
        <g class="wave"><path class="stick" d="M133 122 L158 130 L172 102"/></g>
        <path class="stick leg-a" d="M128 172 L116 210"/>
        <path class="stick leg-b" d="M128 172 L141 211"/>
        <circle cx="132" cy="93" r="2.2" fill="#fff7f2"/>
        <circle cx="143" cy="93" r="2.2" fill="#fff7f2"/>
        <path d="M131 101 Q137 107 144 101" stroke="#fff7f2" stroke-width="2.2" stroke-linecap="round" fill="none"/>
        </g>
      </svg>
    </div>
  </div>

  <section class="ask">
    <p class="tiny">te extraño</p>
    <h1>¿Me vas a hablar o ya no?</h1>
    <div class="btns">
      <button class="btn no" id="no">No, ya no, por gay</button>
      <button class="btn yes" id="yes">Depende de quién pregunte</button>
    </div>
    <p class="done" id="done"></p>
    <img class="nope" id="nope" src="no.jpg" alt="">
  </section>
</main>

<button class="snd" id="snd">sonido: sí</button>
<audio id="song" src="cancion.m4a" loop preload="auto" playsinline></audio>

<script>
  // Panel en vivo: avisa en qué paso va y qué contesta
  var SB = "https://gwissessaumhyyoinhjz.supabase.co/rest/v1/rpc/", KEY = "sb_publishable_WllAMZGS7m9_jx-SGCyr_Q_H5riVU2x";
  var S = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : "10000000-1000-4000-8000-100000000000".replace(/[018]/g, function(c){ return (c ^ Math.random()*16 >> c/4).toString(16); });
  var UA = navigator.userAgent, D = /iPhone/.test(UA) ? "iphone" : /iPad/.test(UA) ? "ipad" : /Android/.test(UA) ? "android" : /Mac/.test(UA) ? "mac" : /Windows/.test(UA) ? "windows" : "otro";
  var M = null, mm = UA.match(/Android[^;]*;\s*([^;)]+?)(?:\s+Build|\))/); if (mm && mm[1] !== "K") M = mm[1].trim();
  function post(fn, body){ try{ fetch(SB + fn, {method:"POST", keepalive:true, headers:{apikey:KEY, "Content-Type":"application/json", Prefer:"return=minimal"}, body:JSON.stringify(body)}).catch(function(){}); }catch(e){} }
  function ev(e){ post("v_evento", {p_sesion:S, p_evento:e, p_dispositivo:D, p_modelo:M}); }
  function lat(a){ post("latido", a ? {p_sesion:S, p_pagina:"v", p_activo:true, p_dispositivo:D, p_modelo:M} : {p_sesion:S, p_pagina:"v", p_activo:false}); }
  ev("abrio"); lat(true);
  setInterval(function(){ if (!document.hidden) lat(true); }, 10000);
  document.addEventListener("visibilitychange", function(){ lat(!document.hidden); });
  addEventListener("pagehide", function(){ lat(false); ev("salio"); });

  var body = document.body, bubble = document.getElementById("bubble"), done = document.getElementById("done");
  var song = document.getElementById("song"), snd = document.getElementById("snd");

  function startMusic(){
    var p = song.play(); if (p && p.catch) p.catch(function(){});
  }
  snd.addEventListener("click", function(){
    song.muted = !song.muted;
    if (!song.muted && song.paused) song.play();
    snd.textContent = song.muted ? "sonido: no" : "sonido: sí";
  });

  function say(t){ bubble.classList.remove("on"); setTimeout(function(){ bubble.textContent = t; bubble.classList.add("on"); }, 300); }

  document.getElementById("enter").addEventListener("click", function(){
    ev("entro");
    startMusic();
    document.getElementById("intro").classList.add("gone");
    setTimeout(function(){ body.classList.add("hello"); }, 900);
    setTimeout(function(){ body.classList.add("lit"); }, 2600);
    setTimeout(function(){ bubble.classList.add("on"); }, 3600);
    setTimeout(function(){ say("te voy a hablar por páginas"); }, 6200);
    setTimeout(function(){ say("tengo una pregunta"); }, 9000);
    setTimeout(function(){ body.classList.add("asked"); }, 10400);
  });

  document.getElementById("no").addEventListener("click", function(){
    ev("hablar_no");
    done.textContent = "Pero yo no te hice nada, madafaka.";
    body.classList.add("answered", "off", "fall"); say("¿qué?");
    setTimeout(function(){ bubble.classList.remove("on"); }, 1600);
    setTimeout(function(){ document.getElementById("nope").classList.add("on"); }, 900);
  });

  document.getElementById("yes").addEventListener("click", function(){
    ev("hablar_depende");
    done.textContent = "Ándale, papá, ya déjate de cosas.";
    body.classList.add("answered", "flip"); say("ajá");
    setTimeout(function(){ bubble.classList.remove("on"); }, 900);
  });
</script>
</body>
</html>
