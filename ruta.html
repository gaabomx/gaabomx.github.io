<!DOCTYPE html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Ruta de recorrido</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
html,body{margin:0;height:100%;font-family:system-ui,-apple-system,sans-serif;background:#111;overscroll-behavior:none}
#map{position:absolute;inset:0}
.top{position:absolute;top:calc(10px + env(safe-area-inset-top));left:10px;right:10px;z-index:5;display:flex;gap:6px;background:rgba(15,18,28,.92);padding:5px;border-radius:14px}
.top button{flex:1;border:0;border-radius:10px;padding:10px 4px;font-size:14px;font-weight:700;background:transparent;color:#cfd6e6}
.top button.on{background:#00b8d4;color:#001}
.panel{position:absolute;left:10px;right:10px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:5;background:rgba(15,18,28,.94);color:#fff;border-radius:16px;padding:12px 14px;box-shadow:0 6px 20px rgba(0,0,0,.4)}
#next{font-size:19px;font-weight:700}
#dist{font-size:14px;color:#9fe9ff;margin-top:2px}
#msg{font-size:13px;color:#ffd84d;margin-top:3px}
.bar{height:6px;background:#2a3142;border-radius:3px;margin-top:8px;overflow:hidden}
.bar>div{height:100%;background:#00e6ff;width:0;transition:width .3s}
.btns{display:flex;gap:6px;margin-top:10px}
.btns button{flex:1;border:0;border-radius:10px;padding:10px 2px;font-size:13px;font-weight:600;background:#263049;color:#fff}
.btns button.on{background:#00b8d4;color:#001}
.num{background:#e6283c;color:#fff;border:3px solid #fff;border-radius:50%;width:26px;height:26px;line-height:26px;text-align:center;font-weight:800;font-size:13px;box-shadow:0 1px 4px rgba(0,0,0,.5)}
.num.s{background:#2fbf5a}.num.done{background:#2fbf5a}
.num.cur{background:#ffb300;color:#000;transform:scale(1.25)}
.arr{width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-bottom:13px solid #fff;filter:drop-shadow(0 0 2px #000)}
.mewrap{width:56px;height:56px;position:relative}.cone{position:absolute;left:50%;top:0;width:0;height:0;margin-left:-14px;border-left:14px solid transparent;border-right:14px solid transparent;border-bottom:28px solid rgba(26,115,232,.55);display:none}.me{position:absolute;left:16px;top:16px;width:18px;height:18px;background:#1a73e8;border:3px solid #fff;border-radius:50%;box-shadow:0 0 0 7px rgba(26,115,232,.25)}
.maplibregl-ctrl-top-right{top:calc(64px + env(safe-area-inset-top))}
</style></head><body>
<div id="map"></div>
<div class="top"><button id="tCol">Colonias (zigzag)</button><button id="tCon">Solo contorno</button></div>
<div class="panel">
  <div id="next">Buscando tu ubicación…</div>
  <div id="dist"></div>
  <div id="msg"></div>
  <div class="bar"><div id="prog"></div></div>
  <div class="btns">
    <button id="follow">Centrarme</button>
    <button id="north">Norte arriba</button>
    <button id="skip">Saltar punto</button>
    <button id="reset">Reiniciar</button>
  </div>
</div>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
const R={"contorno": {"approach": [[-96.744075, 17.084165], [-96.743779, 17.083276], [-96.743365, 17.082191], [-96.742757, 17.08122], [-96.741846, 17.080344], [-96.741472, 17.080166]], "loop": [[-96.741472, 17.080166], [-96.740956, 17.08017], [-96.740063, 17.080664], [-96.73926, 17.081054], [-96.73867, 17.08018], [-96.739348, 17.079822], [-96.740045, 17.079494], [-96.739476, 17.079082], [-96.738658, 17.078484], [-96.737787, 17.077668], [-96.737619, 17.077435], [-96.737899, 17.077103], [-96.738777, 17.076519], [-96.738836, 17.076343], [-96.739796, 17.075886], [-96.739313, 17.075231], [-96.740356, 17.074674], [-96.741109, 17.075709], [-96.741523, 17.075922], [-96.742132, 17.076893], [-96.744994, 17.075563], [-96.746931, 17.078676], [-96.743501, 17.080199], [-96.742, 17.080045], [-96.741472, 17.080166]], "cps": [["S", [-96.744075, 17.084165]], ["1", [-96.741472, 17.080166]], ["2", [-96.73926, 17.081054]], ["3", [-96.740045, 17.079494]], ["4", [-96.737619, 17.077435]], ["5", [-96.739796, 17.075886]], ["6", [-96.739313, 17.075231]], ["7", [-96.742132, 17.076893]], ["8", [-96.744994, 17.075563]], ["9", [-96.746931, 17.078676]], ["FIN", [-96.741472, 17.080166]]]}, "colonias": {"approach": [[-96.744075, 17.084165], [-96.743779, 17.083276], [-96.743365, 17.082191], [-96.742757, 17.08122], [-96.741846, 17.080344], [-96.741472, 17.080166]], "loop": [[-96.741472, 17.080166], [-96.740956, 17.08017], [-96.740063, 17.080664], [-96.73926, 17.081054], [-96.73867, 17.08018], [-96.739348, 17.079822], [-96.740045, 17.079494], [-96.739629, 17.079158], [-96.738878, 17.078396], [-96.740368, 17.077459], [-96.740045, 17.076877], [-96.738321, 17.077893], [-96.737912, 17.077594], [-96.737619, 17.077435], [-96.737899, 17.077103], [-96.738777, 17.076519], [-96.738836, 17.076343], [-96.739796, 17.075886], [-96.739313, 17.075231], [-96.740356, 17.074674], [-96.741109, 17.075709], [-96.741523, 17.075922], [-96.742132, 17.076893], [-96.741704, 17.07717], [-96.740626, 17.077806], [-96.740843, 17.078276], [-96.741996, 17.077596], [-96.742709, 17.078755], [-96.741444, 17.079517], [-96.741692, 17.080036], [-96.742285, 17.080085], [-96.743501, 17.080199], [-96.746931, 17.078676], [-96.744994, 17.075563], [-96.742132, 17.076893], [-96.742799, 17.078037], [-96.743939, 17.0799], [-96.743501, 17.080199], [-96.742285, 17.080085], [-96.741472, 17.080166]], "cps": [["S", [-96.744075, 17.084165]], ["1", [-96.741472, 17.080166]], ["2", [-96.73926, 17.081054]], ["3", [-96.740045, 17.079494]], ["4", [-96.738878, 17.078396]], ["5", [-96.740368, 17.077459]], ["6", [-96.740045, 17.076877]], ["7", [-96.738321, 17.077893]], ["8", [-96.737619, 17.077435]], ["9", [-96.739313, 17.075231]], ["10", [-96.742132, 17.076893]], ["11", [-96.740626, 17.077806]], ["12", [-96.740843, 17.078276]], ["13", [-96.741996, 17.077596]], ["14", [-96.742709, 17.078755]], ["15", [-96.741444, 17.079517]], ["16", [-96.746931, 17.078676]], ["17", [-96.744994, 17.075563]], ["10", [-96.742132, 17.076893]], ["18", [-96.743939, 17.0799]], ["FIN", [-96.741472, 17.080166]]]}};
const BEARING=148; // igual que tu vista de Google Maps
const store={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let route=store.get('ruta_sel','colonias');
const map=new maplibregl.Map({container:'map',center:R.colonias.cps[1][1],zoom:16,bearing:BEARING,
 dragRotate:true,touchZoomRotate:true,touchPitch:false,pitchWithRotate:false,attributionControl:{compact:true},
 style:{version:8,sources:{osm:{type:'raster',tiles:['https://a.tile.openstreetmap.org/{z}/{x}/{y}.png','https://b.tile.openstreetmap.org/{z}/{x}/{y}.png','https://c.tile.openstreetmap.org/{z}/{x}/{y}.png'],tileSize:256,maxzoom:19,attribution:'© OpenStreetMap'}},layers:[{id:'osm',type:'raster',source:'osm'}]}});
map.addControl(new maplibregl.NavigationControl({showZoom:false,visualizePitch:false}),'top-right');
let markers=[],idx=0,me=null,follow=false,lastFix=null;
const trail={type:'Feature',geometry:{type:'LineString',coordinates:(()=>{try{return JSON.parse(localStorage.getItem('ruta_trail'))||[]}catch(e){return[]}})()}};
const line=c=>({type:'Feature',geometry:{type:'LineString',coordinates:c}});
const dist=(a,b)=>{const R0=6371000,t=Math.PI/180,dl=(b[1]-a[1])*t,dn=(b[0]-a[0])*t;const x=Math.sin(dl/2)**2+Math.cos(a[1]*t)*Math.cos(b[1]*t)*Math.sin(dn/2)**2;return 2*R0*Math.asin(Math.sqrt(x))};
const brg=(a,b)=>{const t=Math.PI/180,y=Math.sin((b[0]-a[0])*t)*Math.cos(b[1]*t),x=Math.cos(a[1]*t)*Math.sin(b[1]*t)-Math.sin(a[1]*t)*Math.cos(b[1]*t)*Math.cos((b[0]-a[0])*t);return Math.atan2(y,x)/t};
function el(cls,txt){const d=document.createElement('div');d.className=cls;if(txt)d.textContent=txt;return d}
function draw(){
 const D=R[route];markers.forEach(m=>m.remove());markers=[];
 map.getSource('loop').setData(line(D.loop));map.getSource('app').setData(line(D.approach));
 const all=D.approach.concat(D.loop.slice(1));
 for(let i=0;i<all.length-1;i++){const a=all[i],b=all[i+1];if(dist(a,b)<60)continue;
  markers.push(new maplibregl.Marker({element:el('arr'),rotation:brg(a,b),rotationAlignment:'map'}).setLngLat([(a[0]+b[0])/2,(a[1]+b[1])/2]).addTo(map));}
 const seen={};
 D.cps.forEach(c=>{if(seen[c[0]]||c[0]==='FIN')return;seen[c[0]]=1;
  const e=el('num'+(c[0]==='S'?' s':''),c[0]);e.id='n'+c[0];markers.push(new maplibregl.Marker({element:e}).setLngLat(c[1]).addTo(map));});
 idx=+store.get('ruta_idx_'+route,0);
 document.getElementById('tCol').classList.toggle('on',route==='colonias');
 document.getElementById('tCon').classList.toggle('on',route==='contorno');
 paint();
}
function paint(){const D=R[route];
 document.querySelectorAll('.num').forEach(e=>e.classList.remove('cur','done'));
 for(let i=0;i<idx;i++){const e=document.getElementById('n'+D.cps[i][0]);if(e&&D.cps[i][0]!=='S')e.classList.add('done')}
 const c=D.cps[idx];
 if(c){const e=document.getElementById('n'+(c[0]==='FIN'?'1':c[0]));if(e){e.classList.remove('done');e.classList.add('cur')}}
 document.getElementById('prog').style.width=(100*idx/D.cps.length)+'%';
 if(idx>=D.cps.length){document.getElementById('next').textContent='¡Recorrido terminado! 🎉';document.getElementById('dist').textContent=''}
 else{document.getElementById('next').textContent='Siguiente: punto '+(c[0]==='FIN'?'1 (fin)':c[0]);if(lastFix)showDist(lastFix)}
}
function showDist(p){const D=R[route];const g=map.getSource('go');if(g)g.setData(line(idx<D.cps.length?[p.ll,D.cps[idx][1]]:[]));if(idx<D.cps.length)document.getElementById('dist').textContent=`A ${Math.round(dist(p.ll,D.cps[idx][1]))} m · precisión ±${Math.round(p.acc)} m`}
function onPos(p){const ll=[p.coords.longitude,p.coords.latitude];lastFix={ll,acc:p.coords.accuracy};
 if(!me){const w=el('mewrap');w.appendChild(el('cone'));w.appendChild(el('me'));me=new maplibregl.Marker({element:w,rotationAlignment:'map'}).setLngLat(ll).addTo(map)}else me.setLngLat(ll);
 let hd=(p.coords.heading!=null&&!isNaN(p.coords.heading)&&p.coords.speed>0.3)?p.coords.heading:null;
 const tl=trail.geometry.coordinates[trail.geometry.coordinates.length-1];if(hd===null&&tl&&dist(tl,ll)>4)hd=brg(tl,ll);
 if(hd!==null){me.setRotation(hd);me.getElement().querySelector('.cone').style.display='block'}
 const tc=trail.geometry.coordinates,l=tc[tc.length-1];if(!l||dist(l,ll)>5){tc.push(ll);map.getSource('trail')&&map.getSource('trail').setData(trail);store.set('ruta_trail',JSON.stringify(tc.slice(-3000)))}
 if(follow)map.easeTo({center:ll,duration:500});
 const D=R[route];for(let j=idx;j<Math.min(idx+4,D.cps.length);j++){if(dist(ll,D.cps[j][1])<30){idx=j+1;store.set('ruta_idx_'+route,idx);paint();if(navigator.vibrate)navigator.vibrate(200);break}}
 showDist(lastFix);document.getElementById('msg').textContent='';}
let started=false;function init(){if(started)return;started=true;
 map.addSource('app',{type:'geojson',data:line([])});map.addSource('loop',{type:'geojson',data:line([])});map.addSource('trail',{type:'geojson',data:trail});map.addSource('go',{type:'geojson',data:line([])});
 map.addLayer({id:'go',type:'line',source:'go',paint:{'line-color':'#ffb300','line-width':3,'line-dasharray':[1,1.5]}});
 map.addLayer({id:'loop-c',type:'line',source:'loop',paint:{'line-color':'#000','line-width':10,'line-opacity':.5},layout:{'line-join':'round','line-cap':'round'}});
 map.addLayer({id:'loop',type:'line',source:'loop',paint:{'line-color':'#00e6ff','line-width':6},layout:{'line-join':'round','line-cap':'round'}});
 map.addLayer({id:'app',type:'line',source:'app',paint:{'line-color':'#ffd600','line-width':5,'line-dasharray':[2,1.5]}});
 map.addLayer({id:'trail',type:'line',source:'trail',paint:{'line-color':'#ff2d95','line-width':7,'line-opacity':.9},layout:{'line-join':'round','line-cap':'round'}});
 draw();
 const b=new maplibregl.LngLatBounds();R[route].loop.concat(R[route].approach).forEach(p=>b.extend(p));
 map.fitBounds(b,{padding:{top:80,bottom:200,left:30,right:30},bearing:BEARING,duration:0});
 if(!navigator.geolocation)document.getElementById('msg').textContent='Tu navegador no tiene GPS disponible.';
 else navigator.geolocation.watchPosition(onPos,()=>{document.getElementById('msg').textContent='Activa la ubicación para este sitio.'},{enableHighAccuracy:true,maximumAge:2000,timeout:20000});
}
map.on('style.load',init);map.on('load',init);
const fb=document.getElementById('follow');
fb.onclick=()=>{follow=!follow;fb.classList.toggle('on',follow);fb.textContent=follow?'Siguiéndome':'Centrarme';if(follow&&lastFix)map.easeTo({center:lastFix.ll,zoom:Math.max(map.getZoom(),17)})};
map.on('dragstart',()=>{if(follow){follow=false;fb.classList.remove('on');fb.textContent='Centrarme'}});
let northUp=false;const nb=document.getElementById('north');
nb.onclick=()=>{northUp=!northUp;map.easeTo({bearing:northUp?0:BEARING});nb.textContent=northUp?'Vista Google':'Norte arriba'};
document.getElementById('skip').onclick=()=>{if(idx<R[route].cps.length){idx++;store.set('ruta_idx_'+route,idx);paint()}};
document.getElementById('reset').onclick=()=>{idx=0;store.set('ruta_idx_'+route,0);trail.geometry.coordinates=[];store.set('ruta_trail','[]');map.getSource('trail').setData(trail);paint()};
document.getElementById('tCol').onclick=()=>{route='colonias';store.set('ruta_sel',route);draw()};
document.getElementById('tCon').onclick=()=>{route='contorno';store.set('ruta_sel',route);draw()};
let wl=null;async function lock(){try{wl=await navigator.wakeLock.request('screen')}catch(e){}}
document.addEventListener('click',lock,{once:true});document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')lock()});
</script></body></html>
