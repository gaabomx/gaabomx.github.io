<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Registro de invitados</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1115;--card:#181b22;--ink:#f2f3f5;--mute:#9aa1ad;--ok:#1fbf6a;--warn:#f0a21a;--bad:#e5484d;--line:#2a2f3a}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Inter,system-ui,sans-serif;overflow-x:clip}
header{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
h1{font-size:18px;margin:0;font-weight:800}
.tabs{display:flex;gap:6px}
.tabs button{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font:600 15px Inter,sans-serif;min-height:44px}
.tabs button.on{background:var(--ink);color:var(--bg)}
main{max-width:720px;margin:0 auto;padding:14px 16px 40px}
#reader{width:100%;border-radius:16px;overflow:hidden;background:#000;min-height:260px}
#reader video{border-radius:16px}
.flash{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .35s;z-index:20}
.res{margin-top:12px;border-radius:14px;padding:16px;background:var(--card);border-left:6px solid var(--line);min-height:84px}
.res b{display:block;font-size:22px;line-height:1.15}
.res small{color:var(--mute)}
.res.ok{border-color:var(--ok)}.res.rep{border-color:var(--warn)}.res.new{border-color:#4f8cff}.res.err{border-color:var(--bad)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px;color:var(--mute);font-size:14px}
.pill{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:6px 12px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--bad);margin-right:6px}
.dot.on{background:var(--ok)}
input,button.big{font:16px Inter,sans-serif;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:12px 14px;min-height:48px;width:100%}
button.big{background:var(--ok);color:#06210f;font-weight:800;border:0;margin-top:10px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--card);border-radius:14px;padding:14px}
.stat b{font-size:clamp(26px,8vw,40px);display:block;line-height:1}
.stat span{color:var(--mute);font-size:13px}
.bar{height:10px;border-radius:99px;background:var(--line);margin:12px 0;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .4s}
.seg{display:flex;gap:6px;margin:12px 0;flex-wrap:wrap}
.seg button{flex:1;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px;font:600 14px Inter,sans-serif;min-height:44px}
.seg button.on{border-color:var(--ink)}
ul{list-style:none;padding:0;margin:0}
li{display:flex;justify-content:space-between;gap:10px;padding:12px 4px;border-bottom:1px solid var(--line)}
li .n{font-weight:600;overflow-wrap:anywhere}
li .t{color:var(--mute);font-size:13px;white-space:nowrap;text-align:right}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;margin-left:6px}
.tag.si{background:#103a24;color:#5ee39a}.tag.no{background:#3a1414;color:#ff8a8d}.tag.x{background:#14264a;color:#8fb4ff}
.hide{display:none!important}
.manual{display:flex;gap:8px;margin-top:12px}
.manual input{flex:1}.manual button{width:auto;margin:0;background:var(--card);color:var(--ink);border:1px solid var(--line)}
</style>
</head>
<body>
<div class="flash" id="flash"></div>
<header>
  <h1>Registro</h1>
  <div class="tabs"><button id="tEsc" class="on">Escanear</button><button id="tPan">Lista</button></div>
</header>

<main>
  <section id="vNombre" class="hide">
    <p>¿Quién está escaneando? (solo se pregunta una vez)</p>
    <input id="miNombre" placeholder="Tu nombre, ej. Arturo" maxlength="40">
    <button class="big" id="guardarNombre">Empezar a escanear</button>
  </section>

  <section id="vEsc" class="hide">
    <div id="reader"></div>
    <button class="big hide" id="btnCam">Abrir cámara</button>
    <div class="res" id="res"><b>Listo para escanear</b><small>Apunta al QR. Se guarda solo.</small></div>
    <div class="manual"><input id="manual" placeholder="Escribir código a mano"><button class="big" id="btnManual">Registrar</button></div>
    <div class="row">
      <span class="pill"><span class="dot" id="dot"></span><span id="net">Conectando…</span></span>
      <span class="pill">Tus escaneos: <b id="mios">0</b></span>
      <span class="pill" id="pendWrap">Pendientes: <b id="pend">0</b></span>
      <span class="pill" id="quien"></span>
    </div>
  </section>

  <section id="vPan" class="hide">
    <div class="stats">
      <div class="stat"><b id="sSi">0</b><span>Asistieron</span></div>
      <div class="stat"><b id="sNo">0</b><span>Faltan</span></div>
      <div class="stat"><b id="sTot">0</b><span>En lista</span></div>
    </div>
    <div class="bar"><i id="barra"></i></div>
    <input id="buscar" placeholder="Buscar nombre o código">
    <div class="seg">
      <button data-f="si" class="on">Asistieron</button>
      <button data-f="no">Faltan</button>
      <button data-f="x">Fuera de lista</button>
      <button data-f="todos">Todos</button>
    </div>
    <ul id="lista"></ul>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
{
const URL_SB='https://gwissessaumhyyoinhjz.supabase.co';
const KEY='sb_publishable_WllAMZGS7m9_jx-SGCyr_Q_H5riVU2x';
const sb=supabase.createClient(URL_SB,KEY);
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

let yo=ls.get('ev_yo',''), cola=ls.get('ev_cola',[]), mios=ls.get('ev_mios',0);
let datos=new Map(), filtro='si', vista='esc', scanner=null, ultimo={c:'',t:0};

/* ---------- vistas ---------- */
function mostrar(v){
  vista=v;
  $('tEsc').classList.toggle('on',v==='esc');$('tPan').classList.toggle('on',v==='pan');
  $('vNombre').classList.toggle('hide',!(v==='esc'&&!yo));
  $('vEsc').classList.toggle('hide',!(v==='esc'&&yo));
  $('vPan').classList.toggle('hide',v!=='pan');
  if(v==='esc'&&yo)iniciarCam(); else pararCam();
  if(v==='pan')pintar();
}
$('tEsc').onclick=()=>mostrar('esc');
$('tPan').onclick=()=>mostrar('pan');
$('guardarNombre').onclick=()=>{const n=$('miNombre').value.trim();if(!n)return;yo=n;ls.set('ev_yo',yo);mostrar('esc')};
$('quien').textContent='';

/* ---------- cámara ---------- */
async function iniciarCam(){
  $('quien').textContent='Escanea: '+yo;
  if(scanner)return;
  try{
    scanner=new Html5Qrcode('reader',{verbose:false});
    await scanner.start({facingMode:'environment'},{fps:12,qrbox:(w,h)=>{const s=Math.floor(Math.min(w,h)*0.7);return{width:s,height:s}}},leido,()=>{});
    $('btnCam').classList.add('hide');
  }catch(e){
    scanner=null;$('btnCam').classList.remove('hide');
    resultado('err','No se pudo abrir la cámara','Da permiso de cámara y toca "Abrir cámara".');
  }
}
async function pararCam(){if(scanner){try{await scanner.stop();scanner.clear()}catch(e){}scanner=null}}
$('btnCam').onclick=iniciarCam;
$('btnManual').onclick=()=>{const c=$('manual').value.trim();if(c){$('manual').value='';procesar(c)}};

function leido(txt){
  const ahora=Date.now();
  if(txt===ultimo.c&&ahora-ultimo.t<4000)return; // evita doble lectura del mismo QR
  ultimo={c:txt,t:ahora};
  procesar(txt);
}

/* ---------- feedback ---------- */
let ac=null;
function beep(f){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.connect(g);g.connect(ac.destination);g.gain.setValueAtTime(.2,ac.currentTime);o.start();o.stop(ac.currentTime+.15)}catch(e){}}
function flash(col){const f=$('flash');f.style.background=col;f.style.opacity=.35;setTimeout(()=>f.style.opacity=0,250)}
function resultado(cls,titulo,sub){$('res').className='res '+cls;$('res').innerHTML='<b>'+esc(titulo)+'</b><small>'+esc(sub)+'</small>'}
const hora=t=>t?new Date(t).toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'}):'';

/* ---------- guardar ---------- */
async function procesar(codigo){
  codigo=codigo.trim().slice(0,300);
  const conocido=datos.get(codigo);
  // respuesta inmediata con lo que ya sabemos, sin esperar la red
  if(conocido&&conocido.asistio){resultado('rep','Ya había entrado: '+(conocido.nombre||codigo),'Registrado a las '+hora(conocido.hora)+' por '+(conocido.escaneado_por||'—'));flash('#f0a21a');beep(440);navigator.vibrate&&navigator.vibrate([80,60,80]);}
  else{resultado(conocido&&conocido.en_lista?'ok':'new',conocido&&conocido.nombre?conocido.nombre:codigo,conocido&&conocido.en_lista?'Asistencia guardada ✓':'Guardado (no está en la lista todavía)');flash('#1fbf6a');beep(880);navigator.vibrate&&navigator.vibrate(120);}
  mios++;ls.set('ev_mios',mios);$('mios').textContent=mios;
  const ok=await enviar(codigo);
  if(!ok){cola.push(codigo);ls.set('ev_cola',cola);actualizarCola()}
}
async function enviar(codigo){
  try{
    const {data,error}=await sb.rpc('ev_registrar',{p_codigo:codigo,p_escaner:yo});
    if(error||!data||!data.ok)return false;
    const r=datos.get(codigo)||{codigo,en_lista:false,veces:0};
    Object.assign(r,{asistio:true,hora:r.hora||data.hora,escaneado_por:r.escaneado_por||data.por,nombre:data.nombre??r.nombre,en_lista:data.en_lista});
    datos.set(codigo,r);if(vista==='pan')pintar();
    return true;
  }catch(e){return false}
}
function actualizarCola(){$('pend').textContent=cola.length;$('pendWrap').style.display=cola.length?'':'none'}
setInterval(async()=>{
  if(!cola.length)return;
  const copia=[...cola];
  for(const c of copia){if(await enviar(c)){cola.splice(cola.indexOf(c),1);ls.set('ev_cola',cola)}else break}
  actualizarCola();
},4000);

/* ---------- datos en vivo ---------- */
async function cargar(){
  const todos=[];let desde=0;
  while(true){
    const {data,error}=await sb.from('ev_invitados').select('*').range(desde,desde+999);
    if(error){estado(false);return}
    todos.push(...data);if(data.length<1000)break;desde+=1000;
  }
  datos=new Map(todos.map(r=>[r.codigo,r]));estado(true);pintar();
}
function estado(on){$('dot').classList.toggle('on',on);$('net').textContent=on?'En línea':'Sin conexión (se guarda y reintenta)'}
sb.channel('ev').on('postgres_changes',{event:'*',schema:'public',table:'ev_invitados'},p=>{
  if(p.eventType==='DELETE')datos.delete(p.old.codigo);else datos.set(p.new.codigo,p.new);
  if(vista==='pan')pintar();
}).subscribe(s=>{if(s==='SUBSCRIBED'){estado(true);cargar()}else if(s==='CHANNEL_ERROR'||s==='TIMED_OUT'||s==='CLOSED')estado(false)});
window.addEventListener('online',cargar);
window.addEventListener('offline',()=>estado(false));

/* ---------- lista ---------- */
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{filtro=b.dataset.f;document.querySelectorAll('.seg button').forEach(x=>x.classList.toggle('on',x===b));pintar()});
$('buscar').oninput=pintar;
function pintar(){
  const arr=[...datos.values()];
  const lista=arr.filter(r=>r.en_lista);
  const si=lista.filter(r=>r.asistio).length;
  $('sSi').textContent=si;$('sNo').textContent=lista.length-si;$('sTot').textContent=lista.length;
  $('barra').style.width=(lista.length?si/lista.length*100:0)+'%';
  const q=$('buscar').value.trim().toLowerCase();
  let ver=arr.filter(r=>filtro==='todos'||(filtro==='si'&&r.asistio&&r.en_lista)||(filtro==='no'&&!r.asistio&&r.en_lista)||(filtro==='x'&&!r.en_lista));
  if(q)ver=ver.filter(r=>(r.nombre||'').toLowerCase().includes(q)||r.codigo.toLowerCase().includes(q));
  ver.sort((a,b)=>a.asistio&&b.asistio?new Date(b.hora)-new Date(a.hora):(a.nombre||a.codigo).localeCompare(b.nombre||b.codigo,'es'));
  $('lista').innerHTML=ver.length?ver.map(r=>{
    const tag=!r.en_lista?'<span class="tag x">fuera de lista</span>':r.asistio?'<span class="tag si">asistió</span>':'<span class="tag no">falta</span>';
    return '<li><div><span class="n">'+esc(r.nombre||r.codigo)+'</span>'+tag+'</div><div class="t">'+(r.asistio?esc(hora(r.hora))+'<br>'+esc(r.escaneado_por||''):'')+'</div></li>'
  }).join(''):'<li><span class="t">Nada por aquí todavía</span></li>';
}

$('mios').textContent=mios;actualizarCola();
mostrar('esc');
}
</script>
</body>
</html>
